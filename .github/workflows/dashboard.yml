name: Dashboard CI

on:
  push:
    branches: [main]
    paths: ['apps/dashboard/**', '.github/workflows/dashboard.yml', '.nvmrc']
  pull_request:
    paths: ['apps/dashboard/**', '.github/workflows/dashboard.yml', '.nvmrc']

concurrency:
  group: dashboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build
